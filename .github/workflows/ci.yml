name: CI
on:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - main
# Automatically stop old builds on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  setup:
    name: Setup workflow
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code_change: ${{ steps.filter.outputs.code }}
      js_change: ${{ steps.filter.outputs.js }}
      quarto_change: ${{ steps.filter.outputs.quarto }}
      img_change: ${{ steps.filter.outputs.img }}
      matrix: ${{ env.MATRIX }}
    steps:
      - uses: actions/checkout@v6
        if: github.event_name != 'pull_request'
      - name: Check for code changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'pyproject.toml'
              - '.github/workflows/ci.yaml'
              - 'docs-sphinx/**'
            js:
              - 'lib/**'
              - 'tests/js/**'
              - 'package.json'
              - 'vitest.config.js'
              - 'build.mjs'
            quarto:
              - 'quarto/**'
              - 'docs-quarto/**'
            img:
              - '**/*.png'
      - name: Set matrix option
        run: |
          if [[ '${{ github.event_name }}' == 'workflow_dispatch' ]]; then
            OPTION=${{ github.event.inputs.target }}
          elif [[ '${{ github.event_name }}' == 'schedule' ]]; then
            OPTION="full"
          elif [[ '${{ github.event_name }}' == 'push' && '${{ github.ref_type }}' == 'tag' ]]; then
            OPTION="full"
          else
            OPTION="default"
          fi
          echo "MATRIX_OPTION=$OPTION" >> $GITHUB_ENV
      - name: Set test matrix with 'default' option
        if: env.MATRIX_OPTION == 'default'
        run: |
          MATRIX=$(jq -nsc '{
              "os": ["ubuntu-latest", "macos-latest", "windows-latest"],
              "environment": ["test-310", "test-312"],
          }')
          echo "MATRIX=$MATRIX" >> $GITHUB_ENV
      - name: Set test matrix with 'full' option
        if: env.MATRIX_OPTION == 'full'
        run: |
          MATRIX=$(jq -nsc '{
              "os": ["ubuntu-latest", "macos-latest", "windows-latest"],
              "environment": ["test-310", "test-311", "test-312"]
          }')
          echo "MATRIX=$MATRIX" >> $GITHUB_ENV
      - name: Set test matrix with 'downstream' option
        if: env.MATRIX_OPTION == 'downstream'
        run: |
          MATRIX=$(jq -nsc '{
              "os": ["ubuntu-latest"],
              "environment": ["test-311"]
          }')
          echo "MATRIX=$MATRIX" >> $GITHUB_ENV

  pixi_lock:
    name: Pixi lock
    runs-on: ubuntu-latest
    steps:
      - uses: holoviz-dev/holoviz_tasks/pixi_lock@v0
        with:
          cache: ${{ github.event.inputs.cache == 'true' || github.event.inputs.cache == '' }}

  pre_commit:
    name: Run pre-commit
    needs: [setup]
    runs-on: ubuntu-latest
    steps:
      - uses: holoviz-dev/holoviz_tasks/pre-commit@v0
      - uses: pre-commit/action@v3.0.1
        if: needs.setup.outputs.img_change == 'true'
        with:
          extra_args: -a --hook-stage manual oxipng || true --
      - uses: stefanzweifel/git-auto-commit-action@v7
        if: needs.setup.outputs.img_change == 'true'
        with:
          commit_message: "Optimize PNG images (lossless)"
          file_pattern: "*.png"

  pytest:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - py312
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@a0af7a228712d6121d37aba47adf55c1332c9c2e # v0.9.4
        with:
          environments: ${{ matrix.environment }}
      - name: Install repository
        run: pixi run -e ${{ matrix.environment }} postinstall
      - name: Run pytest
        run: pixi run -e ${{ matrix.environment }} test-coverage --color=yes

  vitest:
    name: JavaScript tests
    needs: [setup]
    runs-on: ubuntu-latest
    if: needs.setup.outputs.js_change == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.9.4
      - name: Run Vitest
        run: pixi run test-js

  sphinx_build:
    name: Sphinx build
    needs: [setup]
    runs-on: ubuntu-latest
    if: needs.setup.outputs.code_change == 'true'
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          environments: sphinx
      - name: Build Sphinx docs
        run: pixi run -e sphinx build

  quarto_build:
    name: Quarto build
    needs: [setup]
    runs-on: ubuntu-latest
    if: needs.setup.outputs.quarto_change == 'true'
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          environments: quarto
      - name: Build Quarto docs
        run: pixi run -e quarto build

  pytest_ui:
    name: ui:${{ matrix.environment }}:${{ matrix.os }}
    needs: [pre_commit, setup, pixi_lock]
    runs-on: ${{ matrix.os }}
    if: needs.setup.outputs.code_change == 'true'
    strategy:
      fail-fast: false
      matrix:
        environment: ["test-ui"]
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
    timeout-minutes: 60
    env:
      PANEL_LOG_LEVEL: info
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          environments: ${{ matrix.environment }}

      - name: Install Dependencies
        run: |
          pixi run -e ${{ matrix.environment }} postinstall

      - name: Verify Pixi Installation
        run: pixi --version

      - name: Configure Coverage
        shell: bash
        run: |
          echo "[run]" > .uicoveragerc
          echo "concurrency = greenlet" >> .uicoveragerc

      - name: Test UI
        shell: bash
        run: |
          pixi run -e ${{ matrix.environment }} test-ui --cov-config=.uicoveragerc \
            --screenshot only-on-failure --full-page-screenshot \
            --output ui_screenshots --tracing retain-on-failure

      - name: Upload UI Screenshots
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ui_screenshots_${{ runner.os }}
          path: ./ui_screenshots
          if-no-files-found: ignore
