[workspace]
name = "panel-live"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[tasks]
postinstall = "pip install --no-build-isolation --no-deps --disable-pip-version-check -e ."
serve = "python serve.py"
npm-install = "npm install"
build-js = { cmd = "node build.mjs", depends-on = ["npm-install"] }
build-js-dev = { cmd = "node build.mjs --dev", depends-on = ["npm-install"] }
test-js = { cmd = "npx vitest run", depends-on = ["npm-install"] }
test-js-coverage = { cmd = "npx vitest run --coverage", depends-on = ["npm-install"] }
sync-assets = { cmd = "cp dist/panel-live.js dist/panel-live-worker.js docs/assets/js/ && cp dist/panel-live.css docs/assets/css/", depends-on = ["build-js"] }

[dependencies]
python = ">=3.12"
pip = "*"
hatchling = "*"
hatch-vcs = "*"
panel = ">=1.5.0"
setuptools = ">=61"
setuptools-scm = "*"

[feature.test.dependencies]
pytest = ">=6"
pytest-cov = "*"
mypy = "*"
[feature.test.tasks]
test = "pytest"
test-coverage = "pytest --cov=panel_live --cov-report=xml --cov-report=term-missing"

[feature.build.dependencies]
python-build = "*"
twine = "*"
wheel = "*"
[feature.build.tasks]
build-wheel = "python -m build --no-isolation ."
check-wheel = "twine check dist/*"

[feature.lint.dependencies]
pre-commit = "*"

[feature.lint.tasks]
lint = "pre-commit run --all-files"
lint-install = "pre-commit install"

[feature.py312.dependencies]
python = "3.12.*"

[feature.test-ui.activation]
env = { PLAYWRIGHT_NODEJS_PATH = "node" }

[feature.test-ui.dependencies]
pytest-asyncio = "*"
pytest-rerunfailures = "*"
pytest-xdist = "*"
jupyter_server = "*"
esbuild = "*"
packaging = "*"
nodejs = "*"

[feature.test-ui.pypi-dependencies]
playwright = "*"
pytest-playwright = "*"

[feature.test-ui.tasks]
_install-ui = 'playwright install chromium'

[feature.test-ui.tasks.test-ui]
cmd = 'pytest tests/ui --ui --browser chromium -n logical --dist loadgroup --reruns 3 --reruns-delay 10'
depends-on = ["_install-ui"]

[feature.docs.dependencies]
zensical = "*"
mkdocstrings-python = "*"
panel = ">=1.5.0"
pip = "*"
hatchling = "*"
hatch-vcs = "*"
setuptools = ">=61"
setuptools-scm = "*"

[feature.docs.tasks]
_postinstall = "pip install --no-build-isolation --no-deps --disable-pip-version-check -e ."
_npm-install = "npm install"
_build-js = { cmd = "node build.mjs", depends-on = ["_npm-install"] }
_sync-assets = { cmd = "cp dist/panel-live.js dist/panel-live-worker.js docs/assets/js/ && cp dist/panel-live.css docs/assets/css/", depends-on = ["_build-js"] }

[feature.docs.tasks.serve]
cmd = "zensical serve"
depends-on = ["_postinstall", "_sync-assets"]

[feature.docs.tasks.build]
cmd = "zensical build"
depends-on = ["_postinstall", "_sync-assets"]

[environments]
default = ["test"]
py312 = ["py312", "test"]
test-ui = ["py312", "test", "test-ui"]
docs = ["docs"]
build = ["build"]
lint = { features = ["lint"], no-default-feature = true }
